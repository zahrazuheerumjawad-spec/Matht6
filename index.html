<!DOCTYPE html>
<html>
<head>
<title>Math Quiz</title>
<style>
body{font-family:Arial;text-align:center;background:#eef7ff;padding:30px}
.box{background:white;padding:25px;border-radius:20px;max-width:700px;margin:auto}
.option{display:block;margin:10px auto;padding:15px;width:80%;font-size:20px;color:black;background:#f1f8ff;border:2px solid #2196f3;border-radius:10px}
</style>
</head>
<body>
<div class="box">
<h1>🌟 Math Quiz 🌟</h1>
<p id="score"></p>
<h2 id="question"></h2>
<div id="options"></div>
<p id="feedback"></p>
<button onclick="nextQuestion()">Next</button>
</div>

<script>
const questions=[
{q:"What is (6 + 4) × 2?",o:["20","14","16","10"],a:"20",e:"Parentheses first."},
{q:"What is 8 + 12 ÷ 3?",o:["20","4","12","10"],a:"12",e:"Divide first."},
{q:"What comes next? 2, 4, 6, 8",o:["9","10","12","14"],a:"10",e:"Add 2 each time."}
];

let current=0;
let score=0;
let answered=false;

function loadQuestion(){
answered=false;
let q=questions[current];
document.getElementById("score").innerHTML="Question "+(current+1)+" of "+questions.length+" | Score: "+score;
document.getElementById("question").innerHTML=q.q;
document.getElementById("feedback").innerHTML="";
let options=document.getElementById("options");
options.innerHTML="";
q.o.forEach(function(opt){
let btn=document.createElement("button");
btn.className="option";
btn.innerHTML=opt;
btn.onclick=function(){checkAnswer(btn,opt)};
options.appendChild(btn);
});
}

function checkAnswer(btn,opt){
if(answered)return;
answered=true;
let q=questions[current];
if(opt===q.a){
score++;
btn.style.background="#c8e6c9";
document.getElementById("feedback").innerHTML="✅ Correct!";
}else{
btn.style.background="#ffcdd2";
document.getElementById("feedback").innerHTML="❌ Wrong! Correct answer: "+q.a+"<br>Reason: "+q.e;
}
}

function nextQuestion(){
current++;
if(current<questions.length){
loadQuestion();
}else{
document.querySelector(".box").innerHTML="<h1>Finished!</h1><h2>Score: "+score+" / "+questions.length+"</h2>";
}
}

loadQuestion();
</script>
</body>
</html>
